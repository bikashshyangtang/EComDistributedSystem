services:

  gatewayservice:
    container_name: gatewayservice
    build:
      context: ./ApiGateway/Gateway.Api
      dockerfile: DockerFile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - customerservice
      - productservice
      - orderservice
      - paymentservice  

  customerservice:
    container_name: customerservice
    build:
      context: ./CustomerServiceAPI/CustomerService.Api
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./CustomerServiceAPI/CustomerService.Api/Data:/app/Data

  productservice:
    container_name: productservice
    build:
      context: ./ProductServiceAPI/ProductService.Api
      dockerfile: Dockerfile
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./ProductServiceAPI/ProductService.Api/Data:/app/Data

  orderservice:
    container_name: orderservice
    build:
      context: ./OrderServiceAPI/OrderService.Api
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CustomerServiceUrl: http://customerservice:8080
      ProductServiceUrl: http://productservice:8080       
    depends_on:
      - customerservice
      - productservice
    volumes:
      - ./OrderServiceAPI/OrderService.Api/Data:/app/Data

  paymentservice:
    container_name: paymentservice
    build:
      context: ./PaymentServiceAPI/PaymentService.Api
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OrderServiceUrl: http://orderservice:8080
      ProductServiceUrl: http://productservice:8080
    depends_on:
      - orderservice
      - productservice
    volumes:
      - ./PaymentServiceAPI/PaymentService.Api/Data:/app/Data
  
